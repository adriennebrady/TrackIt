<mat-card class="example-card">
  <mat-card-header>
    <mat-card-title class="containerName" [matTooltip]="item.ItemName">{{ truncatedName }}</mat-card-title>
    <span class="spacer"></span>
    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="icon-button with a menu">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="renameItem()">
        <mat-icon>border_color</mat-icon>
        <span>Rename</span>
      </button>
      <button mat-menu-item (click)="updateCount()">
        <mat-icon>numbers</mat-icon>
        <span>Update Count</span>
      </button>
      <button mat-menu-item (click)="moveItem()">
        <mat-icon>open_with</mat-icon>
        <span>Move</span>
      </button>
      <button mat-menu-item (click)="editItemNotes()">
        <mat-icon>notes</mat-icon>
        <span>Edit Notes</span>
      </button>
    </mat-menu>
  </mat-card-header>

  <!-- Notes display — only shown if notes exist -->
  <mat-card-content *ngIf="item.Notes">
    <p class="item-notes">{{ item.Notes }}</p>
  </mat-card-content>

  <mat-card-actions>
    <span class="spacer"></span>
    <button mat-icon-button (click)="incrementItem()">
      <mat-icon>add</mat-icon>
    </button>
    <button mat-icon-button (click)="decrementItem()">
      <mat-icon>horizontal_rule</mat-icon>
    </button>
    <span class="countAmount">Count: {{ item.Count }}</span>
    <button mat-icon-button color="primary" (click)="deleteItem()" class="deleteButton">
      <mat-icon>delete</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
